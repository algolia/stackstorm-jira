---
name: flag_issue
runner_type: python-script
description: Add the Jira Flagged value and optionally unassign a matching assignee.
enabled: true
entry_point: flag_issue.py
parameters:
  issue_key:
    type: string
    description: Issue key (e.g. PROJECT-1000).
    required: true
  unassign_if_assignee:
    type: string
    description: Unassign the issue when its current assignee has this display name.
